<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Relevamiento de Palmeras</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link rel="stylesheet"
href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css"/>

<link rel="stylesheet"
href="estilos.css">

</head>

<body>

<div id="mapa"></div>

<div id="panel">

    <h3>Herramientas</h3>

    <button onclick="setColor('red')">
        Rojo
    </button>

    <button onclick="setColor('yellow')">
        Amarillo
    </button>

    <button onclick="setColor('green')">
        Verde
    </button>

    <button onclick="limpiarDibujos()">
        Limpiar dibujos
    </button>

    <hr>

    <button onclick="activarContador()">
        Contar parcelas
    </button>

    <button onclick="limpiarContador()">
        Reiniciar contador
    </button>

    <div style="margin-top:10px;">
        Parcelas contadas:
        <strong><span id="contadorParcelas">0</span></strong>
    </div>

    <hr>

    <div id="colorActual">
        Color actual: red
    </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>

<script src="app.js"></script>

</body>

</html>
